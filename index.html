<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>QC CSKH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* App QC CSKH — xem kết quả chấm câu trả lời Sale (bảng sale_response_review). Monsieur Claude */
:root{
  --bg:#f5f6f8;--surface:#fff;--bg2:#f1f3f6;--border:#e3e6eb;--text:#111827;--text2:#374151;--muted:#6b7280;
  --accent:#2563eb;--accent-fg:#fff;
  --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#be123c;--bad-bg:#ffe4e6;
  --miss:#4338ca;--miss-bg:#e0e7ff;--info:#0e7490;--info-bg:#cffafe;--grey:#4b5563;--grey-bg:#e5e7eb;
  --pend:#a16207;--pend-bg:#fef9c3;--sale-bg:#eff6ff;--sale-fg:#1d4ed8;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#60a5fa;--accent-fg:#0b1220;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --miss:#a5b4fc;--miss-bg:#1f2347;--info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;
  --pend:#fde047;--pend-bg:#332d0e;--sale-bg:#15233d;--sale-fg:#93c5fd;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a21;--bg2:#1e222b;--border:#2b303b;--text:#e5e7eb;--text2:#cbd5e1;--muted:#8b93a3;
  --accent:#60a5fa;--accent-fg:#0b1220;
  --ok:#4ade80;--ok-bg:#12301f;--warn:#fbbf24;--warn-bg:#352812;--bad:#fb7185;--bad-bg:#3a1520;
  --miss:#a5b4fc;--miss-bg:#1f2347;--info:#67e8f9;--info-bg:#0e2e36;--grey:#cbd5e1;--grey-bg:#2b303b;
  --pend:#fde047;--pend-bg:#332d0e;--sale-bg:#15233d;--sale-fg:#93c5fd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--text)}
/* Full màn (anh Hải 28/9: "sao k full màn") — phần nội dung chiếm hết bề ngang còn lại cạnh menu */
.wrap{padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.title{font-size:20px;font-weight:800;margin-right:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;white-space:nowrap}
.badge.stale{background:var(--warn-bg);color:var(--warn)}
.btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=date],input[type=search],input[type=password],textarea{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);font-weight:600;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi-row.kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}
th.num,td.num{white-space:nowrap}
.kpi{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--c,var(--accent));border-radius:14px;padding:12px 14px;cursor:pointer}
.kpi.on{outline:2.5px solid var(--accent);outline-offset:1px}
.kpi .l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--bg2);padding:9px 10px;font-size:11px;font-weight:800;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
td.name{white-space:nowrap;font-weight:700}
.bar select{max-width:280px}
.bar input[type=search]{flex:1;min-width:220px}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th.c,td.c{text-align:center}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.two table{min-width:600px;table-layout:fixed}
.two td.name{overflow:hidden;text-overflow:ellipsis}
.vb{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}
.detail td{background:var(--bg2);padding:12px 16px 14px 30px}
.box{border-radius:10px;padding:10px 13px;margin-top:8px}
.box .h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.thread{border:1px solid var(--border);border-radius:10px;padding:8px;max-height:360px;overflow-y:auto;background:var(--surface)}
.ln{display:flex;gap:9px;padding:5px 9px;border-radius:8px;margin-bottom:2px}
.ln .t{font-size:10.5px;color:var(--muted);white-space:nowrap;min-width:70px;padding-top:2px}
.ln.sale{background:var(--sale-bg)}.ln.cust{background:var(--bg2)}.ln.bot{opacity:.6}
a{color:var(--accent);font-weight:700;text-decoration:none}
.gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px}
.gate h1{font-size:18px;margin:0 0 12px}
.gate input{width:100%;margin-bottom:10px;padding:9px 12px}
.err{color:var(--bad);font-weight:700;font-size:12px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--surface);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:60}
.more{padding:12px;text-align:center}
/* KHUNG APP: thanh menu trái giống app MKT/Sale (dải màu trên cùng, nhóm mục, cài đặt ghim đáy, mục không icon) */
.shell{display:flex;min-height:100vh}
.sidebar{width:228px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1.5px solid var(--border);display:flex;flex-direction:column}
.sb-strip{height:4px;background:linear-gradient(90deg,var(--accent),#7c3aed,#0d9488,#16a34a);flex-shrink:0}
.sb-brand{padding:16px 18px 6px;font-size:15px;font-weight:800;letter-spacing:.01em}
.sb-section{padding:16px 18px 6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;margin:2px 8px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border:1.5px solid transparent}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--sale-bg);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px}
.sb-bottom{margin-top:auto;border-top:1.5px solid var(--border);padding:8px 0 10px}
.sb-tools{display:flex;gap:6px;padding:6px 16px 0}
.sb-tools .btn{flex:1;padding:5px 8px;font-size:11.5px}
.main{flex:1;min-width:0}
.bar .right,.top .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
/* ô chọn gọn kiểu app MKT/Sale */
.sel{height:30px;box-sizing:border-box;padding:3px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:11px;font-weight:700;font-family:var(--font);outline:none;cursor:pointer}
.sel.on{border-color:var(--accent);color:var(--accent)}
.sel:focus{border-color:var(--accent)}
input.sel{font-weight:600;cursor:text}
.sel.tim{flex:1;min-width:200px;max-width:380px}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;padding:5px 14px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font);background:var(--surface);color:var(--text2)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.kpi{display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.kpi .ic svg{width:20px;height:20px}
.late{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.doc h3{font-size:14px;margin:18px 0 6px}
.doc p,.doc li{color:var(--text2);line-height:1.65}
.doc ol,.doc ul{margin:4px 0;padding-left:20px}
.doc code{background:var(--bg2);padding:1px 6px;border-radius:5px;font-size:12px}
@media (max-width:760px){
  .shell{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1.5px solid var(--border)}
  .sb-strip{width:100%}
  .sb-section{display:none}
  .sb-bottom{margin:0;border:none;padding:0;display:flex;flex-wrap:wrap}
  .sb-brand{padding:10px 12px}
  .kpi-row{grid-template-columns:1fr}
  .kpi-row.kpi4{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .kpi .v{font-size:20px}
  .bar .right{margin-left:0}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Cấu hình ──────────────────────────────────────────────────────────────
// Khoá công khai (anon) chỉ gọi được các hàm qc_* — hàm tự kiểm MÃ TRUY CẬP rồi mới trả dữ liệu
// (xem supabase-schema-qc.sql). Không đọc thẳng bảng.
const SB_URL='https://bcrpxfvvjsjpvbksqzls.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjcnB4ZnZ2anNqcHZia3NxemxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzE0OTgsImV4cCI6MjEwMjg0NzQ5OH0.XGEUvHP1YBhxYKD9Xq1yH2gl95-V9VgaY5HfsAnFb2c';
const LS_MA='qc_ma', LS_TEN='qc_ten';

const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
          set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
          del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify({p_ma:S.ma,...args})});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(d&&(d.message||d.hint))||('Lỗi '+r.status);const e=new Error(m);e.status=r.status;throw e;}
  return d;
}

// ── Trạng thái ────────────────────────────────────────────────────────────
const S={ma:ls.get(LS_MA)||'',rows:[],reports:[],threads:{},open:new Set(),pg:0,
  plat:'social',from:'',to:'',brand:'all',sale:'all',verdict:'all',q:'',
  view:(()=>{try{return localStorage.getItem('qc_view')||'report'}catch(e){return'report'}})()};
// Các trang của app (thanh menu trái). Nhóm "Báo cáo" hôm nay mới có 1 trang; Training / Chatbot sẽ thêm nhóm riêng.
const VIEWS={report:'Chất lượng phản hồi',history:'Lịch sử báo sai',nhatky:'Nhật ký chạy',logic:'Logic xử lý dữ liệu'};
async function go(v){S.view=v;ls.set('qc_view',v);if(v==='nhatky')await taiNhatKy();render();window.scrollTo(0,0);}
function shell(content){
  const open=S.reports.filter(r=>r.status==='open').length;
  const item=(v,extra='')=>`<div class="nav-item${S.view===v?' active':''}" onclick="go('${v}')">${VIEWS[v]}${extra}</div>`;
  return`<div class="shell">
    <aside class="sidebar">
      <div class="sb-strip"></div>
      <div class="sb-brand">QC CSKH</div>
      <div class="sb-section">Báo cáo</div>
      ${item('report')}
      <div class="sb-bottom">
        <div class="sb-section" style="padding-top:8px">Cài đặt</div>
        ${item('history',open?`<span class="nav-badge">${open}</span>`:'')}
        ${item('nhatky',nkLoiGan()?'<span class="nav-badge">!</span>':'')}
        ${item('logic')}
        <div class="sb-tools"><button class="btn" onclick="changeCode()">Đổi mã</button><button class="btn" onclick="lock()">Khoá</button></div>
      </div>
    </aside>
    <main class="main"><div class="wrap">${content}</div></main>
  </div>`;
}

// ── Quy ước nghiệp vụ (giữ đúng như trang cũ Dashboard-Meta để số khớp) ───
const VERDICT={
  dung:{l:'Đúng',c:'ok'},thieu:{l:'Thiếu ý',c:'warn'},sai:{l:'Sai kiến thức',c:'bad'},
  chi_bot:{l:'Chỉ bot trả lời',c:'miss'},khong_tra_loi:{l:'Không trả lời',c:'grey'},
  tra_loi_inbox:{l:'Đã tư vấn ở tin nhắn',c:'info'},khong_lien_quan:{l:'Không liên quan',c:'grey'},
  loi_nen_tang:{l:'Lỗi nền tảng',c:'grey'},   // anh Hải 1/10: lỗi KHÔNG do Sale (vd Facebook chặn không nhắn được) → không tính miss, để riêng
  chua_cham:{l:'Chưa chấm',c:'pend'}};
// 4 thương hiệu (anh Hải 29/9: "xếp vào cho đủ 4 thương hiệu: Chánh Tâm, Tự Tại Viên, Hiền Thủy, Shidai").
// Xếp theo MÃ PAGE (14 page trên Pancake); tên page chỉ dùng dự phòng khi page mới chưa có trong bảng này.
const BRANDS={CT:'Chánh Tâm',TTV:'Tự Tại Viên',HT:'Hiền Thủy',Shidai:'Shidai',Khac:'Khác'};
const BRAND_PAGE={
  '107224335550589':'CT','ttm_-000fnwmEFDETu8kL8prpYMAbgrdue0Cc0hG':'CT','pzl_355233102341719971':'CT',
  'pzl_357024678860117283':'CT','ttm_-000wff5HiYIrt76uNDUJiL1kfVVtVkiURi-':'CT',          // Hoàng Dương - Ming Ying (Zalo, TikTok)
  '100667699549693':'TTV',                                                                  // Nến Bơ - Tự Tại Viên
  '105133802417722':'HT','107792638827892':'HT','ttm_-000uG5lXadOZHV4VWlMRAHc5FZGkQtuyxY3':'HT',
  'pzl_1927214341338004925':'HT','pzl_716330578937743406':'HT',                            // … + Siêu Thị Đồ Thờ Cao Cấp (Zalo)
  '506247572578559':'Shidai','pzl_421283811192749346':'Shidai','pzl_636053762312360623':'Shidai',
};
// Dự phòng khi dòng thiếu page_id: so tên page đã BỎ DẤU (1/10: "Hiền Thủy" dấu hỏi trên chữ u lọt sang "Khác").
function brandTen(p){const n=noDau(p||'');
  if(/tu tai vien|nen bo/.test(n))return'TTV';
  if(/hien thuy|do tho cao cap|do ma/.test(n))return'HT';
  if(/shidai|thoi dai|tong kho si/.test(n))return'Shidai';
  if(/chanh tam|hoang duong|ming ying/.test(n))return'CT';
  return'Khac';}
const brandOf=r=>BRAND_PAGE[r.page_id]||brandTen(r.page_name);
const platOf=r=>/^pzl_/.test(r.conv_id||'')?'zalo':'social';
const noDau=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const NOT_SALE=/^(pancake tht holding|botcake|hệ thống|he thong|sales admin)$/i;
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-/i;
const saleOf=r=>{const s=(r.sale_name||'').trim();return(!s||NOT_SALE.test(s)||UUID.test(s))?'(chưa rõ)':s;};
const SEV={'nghiêm trọng':'cao','nhẹ':'thap'};
const sevOf=s=>{const k=(s||'').toLowerCase();return SEV[k]||k;};
const SEV_L={cao:'Cao',trung:'Trung bình',thap:'Thấp'};

// ── Tiện ích ──────────────────────────────────────────────────────────────
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('vi-VN');
const pct=(a,b)=>b?(a/b*100).toFixed(1).replace('.',',')+'%':'—';
const p2=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fmtDT=(at,date)=>{if(!at)return date?date.split('-').reverse().slice(0,2).join('/'):'';const d=new Date(at);
  return`${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;};
let toastT;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=m;t.style.display='';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200);}
const vb=v=>{const x=VERDICT[v]||{l:v,c:'grey'};return`<span class="vb" style="background:var(--${x.c}-bg);color:var(--${x.c})">${esc(x.l)}</span>`;};

// ── Cổng mã truy cập ─────────────────────────────────────────────────────
function renderGate(msg){
  document.getElementById('app').innerHTML=`<div class="gate">
    <h1>QC CSKH</h1>
    <input type="password" id="gMa" placeholder="Mã truy cập" autocomplete="current-password">
    <input type="text" id="gTen" placeholder="Tên anh/chị (ghi vào báo chấm sai)" value="${esc(ls.get(LS_TEN)||'')}">
    <div class="err" id="gErr">${esc(msg||'')}</div>
    <button class="btn pri" style="width:100%;padding:9px" onclick="login()">Vào</button></div>`;
  const i=document.getElementById('gMa');i.focus();
  i.onkeydown=e=>{if(e.key==='Enter')login();};
}
async function login(){
  const ma=document.getElementById('gMa').value.trim(),ten=document.getElementById('gTen').value.trim();
  if(!ma)return;
  S.ma=ma;document.getElementById('gErr').textContent='Đang kiểm…';
  try{await load();ls.set(LS_MA,ma);if(ten)ls.set(LS_TEN,ten);render();}
  catch(e){S.ma='';document.getElementById('gErr').textContent=e.status===403?'Sai mã truy cập':e.message;}
}
function lock(){ls.del(LS_MA);S.ma='';S.rows=[];renderGate();}

// Chỉ tải đúng khoảng ngày đang xem (29/9: quota egress chung với app MKT/Sale — trước đây mỗi lần mở tải cả bảng ~1,5 MB).
// S.tai = khoảng đã tải ({tu,den}, '' = không giới hạn). Khoảng mới nằm trong khoảng đã tải thì lọc tại chỗ, không gọi lại.
async function load(){
  const [rows,reps]=await Promise.all([rpc('qc_ds_cham',{p_tu:S.from||null,p_den:S.to||null}),rpc('qc_ds_bao_sai')]);
  S.rows=rows||[];S.reports=reps||[];S.tai={tu:S.from,den:S.to};
}
const nam=(a,b)=>!b.tu||(a.tu&&a.tu>=b.tu);                 // khoảng a bắt đầu không sớm hơn b
const trongKhoang=()=>S.tai&&nam({tu:S.from},{tu:S.tai.tu})&&(!S.tai.den||(S.to&&S.to<=S.tai.den));
async function ensureRange(){
  if(trongKhoang())return;
  document.getElementById('app').style.opacity='.55';
  try{S.rows=await rpc('qc_ds_cham',{p_tu:S.from||null,p_den:S.to||null})||[];S.tai={tu:S.from,den:S.to};}
  catch(e){toast(e.message);}
  document.getElementById('app').style.opacity='';
}
async function reload(){try{await load();if(S.view==='nhatky')await taiNhatKy();render();toast('Đã tải lại');}catch(e){toast(e.message);}}

// ── Lọc ───────────────────────────────────────────────────────────────────
async function setF(k,v){S[k]=v;S.pg=0;if(k==='from'||k==='to')await ensureRange();render(k==='q');}
// Chọn nhanh ngày — theo đúng bộ lọc app MKT/Sale (anh Hải 5/10): thêm "Hôm qua → hôm nay", "Tháng này" và từng tháng đã qua
const QC_TU_THANG='2026-08';   // dữ liệu QC bắt đầu 22/08/2026 → danh sách tháng không kéo về trước tháng này
const QUICK=[['today','Hôm nay'],['yesterday','Hôm qua'],['2days','Hôm qua → hôm nay'],['7','7 ngày qua'],['30','30 ngày qua'],['thismonth','Tháng này'],['all','Tất cả']];
function quickThang(){   // các tháng có dữ liệu, mới nhất lên trước — chọn 1 lần ra trọn tháng
  const out=[],t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;
  while(`${y}-${p2(m)}`>=QC_TU_THANG){out.push([`thang:${y}-${p2(m)}`,`${m}/${y}`]);if(--m<1){m=12;y--;}}
  return out;
}
function quickRange(k){
  const t=new Date(),d=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return isoDay(x);};
  if(k==='today')return{from:d(0),to:d(0)};
  if(k==='yesterday')return{from:d(1),to:d(1)};
  if(k==='2days')return{from:d(1),to:d(0)};
  if(k==='thismonth')return{from:d(0).slice(0,8)+'01',to:d(0)};
  if(k==='all')return{from:'',to:''};
  if(/^thang:\d{4}-\d{2}$/.test(k)){   // trọn tháng; tháng đang chạy thì chặn tới hôm nay
    const ym=k.slice(6),cuoi=new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0)).toISOString().slice(0,10);
    return{from:ym+'-01',to:cuoi>d(0)?d(0):cuoi};
  }
  return{from:d(Number(k)-1),to:d(0)};
}
async function setQuick(k){if(!k)return;const r=quickRange(k);S.from=r.from;S.to=r.to;S.pg=0;await ensureRange();render();}
async function setRange(days){
  if(days===0){S.from='';S.to='';}
  else{const t=new Date();S.to=isoDay(t);t.setDate(t.getDate()-days+1);S.from=isoDay(t);}
  S.pg=0;await ensureRange();render();
}
function toggleVerdict(v){S.verdict=S.verdict===v?'all':v;S.pg=0;render();}
function setPlat(p){if(p!==S.plat){S.plat=p;S.pg=0;S.brand=S.sale=S.verdict='all';S.q='';}render();}
// "Trả lời muộn N giờ" do tools/soat-miss-pancake.js ghi vào issue khi soát lại Pancake
// Trả lời muộn (anh Hải 7/10): CHỈ lượt khách nhắn trong giờ làm 8h–17h30 mà chờ > 60 phút làm việc. Khách nhắn ngoài giờ → thẻ
// "ngoài giờ", không tính muộn. Dòng cũ chưa có số đo (trước tháng 10) dùng nhãn "Trả lời muộn" cũ trong issue.
// (sửa 7/10) khách nhắn ngoài giờ vẫn đo, tính từ 8h — xem qc_tinh_tg
const lateOf=r=>r.turns?r.turns.map(lateOf).find(Boolean)||'':(r.tg_phan_hoi_max!=null||r.tg_ngoai_gio!=null)?(r.tg_phan_hoi_max>DUNG_GIO?fmtPhut(r.tg_phan_hoi_max):''):lateOf1(r);
const ngoaiGio=r=>(r.turns||[r]).some(t=>t.tg_ngoai_gio>0);
const lateOf1=r=>{const m=(r.issue||'').match(/Trả lời muộn ([\d,]+ (?:giờ|phút))/);return m?m[1]:'';};
// Bình luận mà Sale đã nhắn riêng (2 luồng khác nhau trên Pancake) — nay được CHẤM nội dung tin nhắn, nhãn ở đầu issue.
// Dòng tra_loi_inbox cũ (chưa chấm nội dung) cũng tính vào nhóm này.
const inboxOf=r=>r.turns?r.turns.some(inboxOf):inboxOf1(r);
const inboxOf1=r=>r.verdict==='tra_loi_inbox'||/^Bình luận → tư vấn qua tin nhắn/.test(r.issue||'');
const inboxDelay=r=>r.turns?r.turns.map(inboxDelay).find(Boolean)||'':inboxDelay1(r);
const inboxDelay1=r=>{const m=(r.issue||'').match(/^Bình luận → tư vấn qua tin nhắn \(Sale nhắn sau ([\d,]+ (?:giờ|phút))\)/);return m?m[1]:'';};
// Icon SVG cho thẻ số (anh Hải 28/9: "dashboard thêm icon vào")
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
  dung:svg('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/>'),
  thieu:svg('<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4.5M12 17.5h.01"/>'),
  sai:svg('<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'),
  miss:svg('<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12Z"/><path d="m9.5 9.5 5 5M14.5 9.5l-5 5"/>'),
  inbox:svg('<path d="M4 5h16v10H13l-4 4v-4H4V5Z"/><path d="m9 10 2 2 4-4"/>'),
  muon:svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2.5h6"/>'),
};
// Chấm quy trình áp từ lúc anh Hải gửi bộ quy tắc (06/10/2026 14h53, lúc đẩy luật) — lượt chấm trước đó không xét, không tính vào tỉ lệ
const QT_TU='2026-10-06T07:53:00Z';
const daXetQT=r=>r.reviewed_at&&r.reviewed_at>=QT_TU&&(r.conv_at||'')>=QT_TU&&['dung','thieu','sai'].includes(r.verdict);
function verdictMatch(r,v){
  if(v==='all')return true;
  if(v==='muon')return!!lateOf(r);
  if(v==='qua_inbox')return inboxOf(r);
  if(v==='quy_trinh')return!!r.sai_quy_trinh;
  if(v==='cham_gio')return r.tg_phan_hoi_max>DUNG_GIO&&r.verdict!=='khong_lien_quan';
  if(v==='ngoai_gio')return ngoaiGio(r);   // anh Hải 6/10: thẻ thay "Tư vấn qua tin nhắn"
  if(v==='miss')return r.verdict==='chi_bot'||r.verdict==='khong_tra_loi';
  if(v==='da_cham')return!['tra_loi_inbox','khong_lien_quan','chua_cham','loi_nen_tang'].includes(r.verdict);
  return r.verdict===v;
}
// Tổng hợp 1 nhóm dòng — mẫu số "đã chấm" giống trang cũ: bỏ tra_loi_inbox, chua_cham, khong_lien_quan (+ loi_nen_tang từ 1/10)
function tally(list){
  const c={};for(const r of list)c[r.verdict]=(c[r.verdict]||0)+1;
  const g=k=>c[k]||0;
  const den=list.length-g('tra_loi_inbox')-g('chua_cham')-g('khong_lien_quan')-g('loi_nen_tang');
  return{n:list.length,den,dung:g('dung'),thieu:g('thieu'),sai:g('sai'),bot:g('chi_bot'),none:g('khong_tra_loi'),
    miss:g('chi_bot')+g('khong_tra_loi'),inbox:g('tra_loi_inbox'),pend:g('chua_cham'),klq:g('khong_lien_quan'),loi:g('loi_nen_tang'),...tgPhanHoi(list)};
}
// Thời gian phản hồi (anh Hải 7/10) — phút LÀM VIỆC 8h–17h30 (chỉ lượt khách nhắn trong giờ làm), tính trong CSDL (qc_tinh_tg) từ đoạn hội thoại, chỉ lượt khách từ 1/10.
// Đúng giờ = mọi lượt trong hội thoại được Sale trả lời trong 60 phút làm việc. Chỉ tính hội thoại có Sale trả lời.
const DUNG_GIO=60;
function tgPhanHoi(list){
  const c=list.filter(r=>r.tg_phan_hoi_tb!=null&&r.verdict!=='khong_lien_quan'),v=c.map(r=>r.tg_phan_hoi_tb).sort((a,b)=>a-b);
  return{coTg:c.length,dungGio:c.filter(r=>r.tg_phan_hoi_max<=DUNG_GIO).length,chamGio:c.filter(r=>r.tg_phan_hoi_max>DUNG_GIO).length,
    tbTg:c.length?Math.round(v.reduce((a,b)=>a+b,0)/c.length):null,tvTg:c.length?v[Math.floor((c.length-1)/2)]:null};
}
const fmtPhut=m=>m==null?'—':m<60?m+' phút':(m/60).toFixed(1).replace('.',',')+' giờ';

// ── Vẽ ────────────────────────────────────────────────────────────────────
// GỘP HỘI THOẠI (anh Hải 7/10: "cùng 1 người gộp hết vào cùng 1 hội thoại, trừ khi là zalo / mess / cmt riêng thì tách"):
// mỗi lượt hỏi–đáp vẫn chấm riêng trong CSDL, trang gộp theo conv_id (mỗi kênh / bình luận có conv_id riêng nên tự tách).
// Kết quả hội thoại = lượt nặng nhất: sai > thiếu > miss > chờ chấm > lỗi nền tảng > đúng.
const NANG={sai:7,thieu:6,khong_tra_loi:5,chi_bot:5,chua_cham:4,tra_loi_inbox:3,loi_nen_tang:2,dung:1};
function gopHoiThoai(list){
  const m=new Map();for(const r of list){const k=r.conv_id||('#'+r.id);(m.get(k)||m.set(k,[]).get(k)).push(r);}
  return[...m.values()].map(ts=>{
    if(ts.length===1)return ts[0];
    ts.sort((a,b)=>(a.conv_at||a.conv_date).localeCompare(b.conv_at||b.conv_date));
    const chinh=ts.reduce((a,b)=>(NANG[b.verdict]||0)>(NANG[a.verdict]||0)?b:a),cuoi=ts[ts.length-1];
    const qt=[...new Set(ts.map(t=>t.sai_quy_trinh).filter(Boolean))].join(' · ')||null;
    return{...chinh,turns:ts,_threadId:cuoi.id,conv_at:cuoi.conv_at,conv_date:cuoi.conv_date,
      sale_name:ts.map(t=>t.sale_name).filter(Boolean).pop()||null,phone:ts.map(t=>t.phone).find(Boolean)||null,
      reviewed_at:ts.reduce((a,t)=>t.reviewed_at&&t.reviewed_at>a?t.reviewed_at:a,''),sai_quy_trinh:qt,
      tg_phan_hoi_tb:(()=>{const v=ts.map(t=>t.tg_phan_hoi_tb).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;})(),
      tg_phan_hoi_max:ts.reduce((a,t)=>t.tg_phan_hoi_max!=null&&(a==null||t.tg_phan_hoi_max>a)?t.tg_phan_hoi_max:a,null)};
  });
}
function render(keepFocus){
  const app=document.getElementById('app');
  if(S.view==='history'){app.innerHTML=shell(historyPage());return;}
  if(S.view==='logic'){app.innerHTML=shell(logicPage());return;}
  if(S.view==='nhatky'){app.innerHTML=shell(nhatKyPage());return;}
  // Chỉ quan tâm tin khách hỏi mua (anh Hải 28/9): dòng "không liên quan" (lời khấn, tương tác, nội bộ) ẩn hẳn, không tính.
  const platRows=S.rows.filter(r=>platOf(r)===S.plat&&r.verdict!=='khong_lien_quan');
  const dated=gopHoiThoai(platRows.filter(r=>(!S.from||r.conv_date>=S.from)&&(!S.to||r.conv_date<=S.to)));
  const q=noDau(S.q.trim());
  const base=dated.filter(r=>{
    if(S.brand!=='all'&&brandOf(r)!==S.brand)return false;
    if(S.sale!=='all'&&saleOf(r)!==S.sale)return false;
    if(q&&!noDau((r.turns||[r]).flatMap(t=>[t.customer_name,t.phone,t.sale_name,t.customer_ask,t.sale_reply,t.issue]).join(' ')).includes(q))return false;
    return true;
  });
  const rows=base.filter(r=>verdictMatch(r,S.verdict));
  const T=tally(base);

  // badge cập nhật
  const maxOf=k=>platRows.reduce((m,r)=>r[k]&&r[k]>m?r[k]:m,'');
  const rev=maxOf('reviewed_at'),conv=maxOf('conv_at');
  const stale=rev&&(Date.now()-new Date(rev))/36e5>36;
  const upd=rev?`<span class="badge${stale?' stale':''}" title="Hội thoại mới nhất: ${esc(fmtDT(conv))}">Cập nhật ${esc(fmtDT(rev))}</span>`:'';
  const openRep=S.reports.filter(r=>r.status==='open').length;

  // lựa chọn lọc
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${cur===v?' selected':''}>${esc(l)}</option>`;
  const countBy=(list,f)=>{const m=new Map();for(const r of list){const k=f(r);m.set(k,(m.get(k)||0)+1);}return[...m].sort((a,b)=>b[1]-a[1]);};
  // 4 thương hiệu luôn hiện đủ, thứ tự cố định (Khác chỉ hiện nếu có page lạ chưa xếp)
  const THU_TU=['CT','TTV','HT','Shidai'];
  const demB=Object.fromEntries(countBy(dated,r=>brandOf(r)));
  const brandOpts=[...THU_TU,...(demB.Khac?['Khac']:[])].map(b=>[b,demB[b]||0]);
  const saleOpts=countBy(dated,saleOf);
  // Bộ lọc gọn kiểu app MKT/Sale: ô chọn nhỏ "Brand: tất cả", ô đang lọc viền màu nhấn; chọn nhanh ngày gom 1 ô.
  const sel=(k,label,cur,opts)=>`<select class="sel${cur!=='all'?' on':''}" onchange="setF('${k}',this.value)">
    ${opt('all',`${label}: tất cả`,cur)}${opts.map(([v,l])=>opt(v,l,cur)).join('')}</select>`;
  const thangQ=quickThang(),quickNow=[...QUICK,...thangQ].find(([k])=>{const r=quickRange(k);return r.from===S.from&&r.to===S.to;});

  const kpi=(key,label,val,sub,color,icon)=>`<div class="kpi${S.verdict===key?' on':''}" style="--c:var(--${color})" onclick="toggleVerdict('${key}')">
    <div class="ic">${ICON[icon]}</div>
    <div><div class="l">${label}</div><div class="v">${val}</div><div class="s">${sub||'&nbsp;'}</div></div></div>`;

  // tóm tắt theo thương hiệu + theo Sale
  const sumRow=(name,t,onclick)=>`<tr class="click" onclick="${onclick}">
    <td class="name">${esc(name)}</td><td class="num">${num(t.den)}</td>
    <td class="num" style="color:var(--ok);font-weight:700">${num(t.dung)}</td>
    <td class="num" style="color:var(--warn);font-weight:700">${num(t.thieu)}</td>
    <td class="num" style="color:var(--bad);font-weight:700">${num(t.sai)}</td>
    <td class="num" style="color:var(--miss);font-weight:700">${num(t.miss)}</td>
    <td class="num">${num(t.pend)}</td>
    <td class="num" style="font-weight:800;color:${!t.den?'var(--muted)':t.dung/t.den>=.7?'var(--ok)':t.dung/t.den>=.5?'var(--warn)':'var(--bad)'}">${pct(t.dung,t.den)}</td>
    <td class="num" style="font-weight:700;color:${!t.coTg?'var(--muted)':t.dungGio/t.coTg>=.8?'var(--ok)':t.dungGio/t.coTg>=.6?'var(--warn)':'var(--bad)'}">${pct(t.dungGio,t.coTg)}</td>
    <td class="num">${fmtPhut(t.tbTg)}</td></tr>`;
  // cột cố định để 2 bảng đặt cạnh nhau gióng thẳng cột (anh Hải: "lệch à")
  const sumHead=first=>`<colgroup><col style="width:20%">${'<col style="width:8.88%">'.repeat(9)}</colgroup><thead><tr><th>${first}</th><th class="num">Đã chấm</th><th class="num">Đúng</th><th class="num">Thiếu</th><th class="num">Sai</th><th class="num">Miss</th><th class="num">Chờ chấm</th><th class="num">Tỉ lệ đúng</th><th class="num">Đúng giờ</th><th class="num">TB phản hồi</th></tr></thead>`;
  const byBrand=[...THU_TU,...(base.some(r=>brandOf(r)==='Khac')?['Khac']:[])].map(b=>sumRow(BRANDS[b]||b,tally(base.filter(r=>brandOf(r)===b)),`setF('brand','${b}')`)).join('');
  const bySale=countBy(base,saleOf).map(([s])=>sumRow(s,tally(base.filter(r=>saleOf(r)===s)),`setF('sale',${esc(JSON.stringify(s))})`)).join('');

  // bảng chi tiết
  // 30 dòng / trang (anh Hải 28/9)
  const nPg=Math.max(1,Math.ceil(rows.length/PER)),pg=Math.min(S.pg,nPg-1);
  const shown=rows.slice(pg*PER,pg*PER+PER);
  const body=shown.map(r=>{
    const open=S.open.has(r.id),rep=S.reports.some(x=>x.review_id===r.id&&x.status==='open');
    return`<tr class="click" onclick="toggleRow(${r.id},${r._threadId||r.id})">
      <td class="muted" style="white-space:nowrap">${open?'▼':'▶'} ${esc(fmtDT(r.conv_at,r.conv_date))}</td>
      <td>${esc(r.page_name||'')}</td>
      <td><div style="font-weight:700">${esc(r.customer_name||'—')}${r.turns?` <span class="badge" title="Số lượt hỏi–đáp trong hội thoại">${r.turns.length} lượt</span>`:''}</div>${r.phone?`<div class="muted" style="font-size:11px">${esc(r.phone)}</div>`:''}</td>
      <td>${saleOf(r)==='(chưa rõ)'?'<span class="muted">—</span>':esc(saleOf(r))}</td>
      <td>${vb(r.verdict)}${sevOf(r.severity)&&['thieu','sai'].includes(r.verdict)?` <span class="muted" style="font-size:11px">${esc(SEV_L[sevOf(r.severity)]||r.severity)}</span>`:''}${lateOf(r)?`<span class="late" title="Khách nhắn trong giờ làm, Sale trả lời sau hơn 1 giờ làm việc">muộn ${esc(lateOf(r))}</span>`:''}${ngoaiGio(r)?`<span class="late" style="background:var(--grey-bg);color:var(--grey)" title="Khách nhắn ngoài giờ làm (8h–17h30) — thời gian chờ tính từ 8h">ngoài giờ</span>`:''}${inboxOf(r)&&r.verdict!=='tra_loi_inbox'?`<span class="late" style="background:var(--info-bg);color:var(--info)" title="Bình luận — Sale nhắn riêng cho khách, chấm theo đoạn tin nhắn">qua tin nhắn${inboxDelay(r)?' · sau '+esc(inboxDelay(r)):''}</span>`:''}</td>
      <td class="c" onclick="event.stopPropagation()">${r.pancake_url?`<a href="${esc(r.pancake_url)}" target="_blank" rel="noopener">Mở</a>`:'<span class="muted">—</span>'}</td>
      <td class="c" onclick="event.stopPropagation()"><button class="btn" style="padding:3px 9px;${rep?'color:var(--bad);border-color:var(--bad)':''}" title="Báo lượt này chấm sai" onclick="openReport(${r.id})">${rep?'Đã báo':'Báo sai'}</button></td>
    </tr>${open?detailRow(r):''}`;
  }).join('')||`<tr><td colspan="7" class="muted" style="padding:30px;text-align:center">Không có lượt nào khớp bộ lọc</td></tr>`;

  app.innerHTML=shell(`
    <div class="top">
      <div class="title" style="margin-right:6px">Chất Lượng Phản Hồi Sale</div>
      <span class="seg"><button class="${S.plat==='social'?'on':''}" onclick="setPlat('social')">Social</button><button class="${S.plat==='zalo'?'on':''}" onclick="setPlat('zalo')">Zalo</button></span>

const PER=30;
function toPg(p){S.pg=p;S.open.clear();render();document.getElementById('chiTiet')?.scrollIntoView({block:'start'});}
function pager(pg,n,total){
  if(n<=1)return'';
  // tối đa 7 nút số: đầu, cuối, quanh trang đang xem
  const set=new Set([0,n-1,pg-2,pg-1,pg,pg+1,pg+2].filter(i=>i>=0&&i<n));
  const list=[...set].sort((a,b)=>a-b);let out='',prev=-1;
  for(const i of list){if(prev>=0&&i-prev>1)out+='<span class="muted" style="padding:0 4px">…</span>';
    out+=`<button class="btn${i===pg?' on':''}" onclick="toPg(${i})">${i+1}</button>`;prev=i;}
  return`<div class="more" style="display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap">
    <button class="btn" ${pg===0?'disabled':''} onclick="toPg(${pg-1})">‹</button>${out}
    <button class="btn" ${pg===n-1?'disabled':''} onclick="toPg(${pg+1})">›</button>
    <span class="muted" style="margin-left:8px;font-size:12px">${num(pg*PER+1)}–${num(Math.min(total,(pg+1)*PER))} / ${num(total)}</span></div>`;
}
function fmtThread(text){
  return text.split('\n').filter(Boolean).map(line=>{
    const m=line.match(/^\[([^\]]+)\]\s+([^:]+):\s?(.*)$/);
    if(!m)return`<div class="ln">${esc(line)}</div>`;
    const [,ts,who,txt]=m,sale=/^Sale/.test(who),bot=who==='Bot';
    return`<div class="ln ${sale?'sale':bot?'bot':'cust'}"><span class="t">${esc(ts.slice(5))}</span>
      <span><b style="color:${sale?'var(--sale-fg)':bot?'var(--muted)':'var(--text)'}">${esc(who)}:</b> ${esc(txt)||'<i class="muted">(gửi ảnh/tệp)</i>'}</span></div>`;
  }).join('');
}
function detailRow(r){
  const x=VERDICT[r.verdict]||{c:'grey'};

  const thread=th===undefined?'<div class="muted">Đang tải hội thoại…</div>'
    :th?`<div class="thread">${fmtThread(th)}</div>`

  const luot=r.turns?`<div class="sec" style="margin:12px 0 6px">Chấm từng lượt (${r.turns.length})</div>`+r.turns.map(t=>{const c=(VERDICT[t.verdict]||{c:'grey'}).c;
      return`<div class="box" style="background:var(--surface);border-left:3px solid var(--${c})"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="muted">${esc(fmtDT(t.conv_at,t.conv_date))}</span>${vb(t.verdict)}${lateOf1(t)?`<span class="late">muộn ${esc(lateOf1(t))}</span>`:''}</div>
        <div style="margin-top:4px"><b>Khách:</b> ${esc((t.customer_ask||'').slice(0,240))}</div>

  if(r.turns)return`<tr class="detail"><td colspan="7">${thread}${luot}</td></tr>`;
  return`<tr class="detail"><td colspan="7">
    ${thread}
    ${r.sai_quy_trinh?`<div class="box" style="background:var(--bad-bg)"><div class="h" style="color:var(--bad)">Sai quy trình</div>${esc(r.sai_quy_trinh)}</div>`:''}
    ${r.issue?`<div class="box" style="background:var(--${x.c}-bg)"><div class="h" style="color:var(--${x.c})">Vấn đề</div>${esc(r.issue)}</div>`:''}
    ${r.suggestion?`<div class="box" style="background:var(--sale-bg)"><div class="h" style="color:var(--sale-fg)">Nên trả lời</div>${esc(r.suggestion)}
      ${r.source_faq?`<div class="muted" style="font-size:11px;margin-top:6px">Căn cứ: ${esc(r.source_faq)}</div>`:''}</div>`:''}

function closeReport(){const m=document.getElementById('repModal');if(m)m.remove();repImgs=[];}
function shrink(file){return new Promise((ok,bad)=>{const fr=new FileReader();fr.onerror=bad;fr.onload=()=>{const im=new Image();im.onerror=bad;
  im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.7));};im.src=fr.result;};fr.readAsDataURL(file);});}
async function repAdd(files){for(const f of[...files].filter(f=>/^image\//.test(f.type))){if(repImgs.length>=3)break;try{repImgs.push(await shrink(f));}catch(e){}}drawRepImgs();}
function repPaste(e){const fs=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();repAdd(fs);}}
function drawRepImgs(){const b=document.getElementById('repImgs');if(!b)return;
  b.innerHTML=repImgs.map((u,i)=>`<span style="position:relative"><img src="${u}" style="width:62px;height:62px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)">
    <button class="btn" style="position:absolute;top:-8px;right:-8px;padding:0 6px" onclick="repImgs.splice(${i},1);drawRepImgs()">✕</button></span>`).join('');}
async function sendReport(){

    closeReport();S.reports=await rpc('qc_ds_bao_sai')||[];render();toast('Đã ghi nhận báo chấm sai');}
  catch(e){toast(e.message);btn.disabled=false;btn.textContent='Gửi';}
}

function nhatKyPage(){

      <td class="num">${soLuong(x.so_cham)}</td>

  return`<div class="top"><div class="title">Nhật ký chạy</div>
      <div class="right"><span class="badge">14 ngày gần nhất</span><button class="sel" onclick="reload()" title="Tải lại">↺</button></div></div>

    <div class="kpi-row">

    <h3>2. Mỗi dòng là cả một hội thoại</h3>
    <ul>

      <li>Khách nhắn thêm (kể cả ngày sau) hoặc Sale nói thêm → nối vào hội thoại và <b>chấm lại cả đoạn</b>: hôm qua đúng mà hôm nay trả lời sai thì cả hội thoại thành sai. Hội thoại không có gì mới thì giữ kết quả đã chấm.</li>
    </ul>

    <ul>
      <li><b>Lọc lúc kéo</b> (vẫn lưu đủ): lời khấn thuần "Nam mô…", câu xã giao "ok / vâng / cảm ơn / chào", chỉ sticker.</li>

      <li>Không lọc: người bán lại / đại lý xin giá ở page Sỉ (là khách sỉ); câu hỏi công dụng lịch sự.</li>

        <tr><td>${vb('loi_nen_tang')}</td><td>Lỗi không do Sale (vd Facebook chặn nhắn riêng sau 7 ngày) — chỉ gắn khi có căn cứ; không tính miss, đếm riêng ở thẻ Miss</td><td>Không</td></tr>
        <tr><td>${vb('khong_lien_quan')}</td><td>Không phải khách hỏi mua — ẩn khỏi báo cáo</td><td>Không</td></tr>
      </tbody>
    </table>
    <p style="margin-top:10px">Tỉ lệ đúng = Đúng / (tất cả − chờ chấm − không liên quan − lỗi nền tảng).</p>

      <li>Khách nhắn <b>ngoài giờ</b> thì tính chờ <b>từ 8h</b> lúc vào làm: nhắn 20h tối, trả lời 9h sáng = chậm 1 giờ; nhắn 7h55, trả lời 11h07 = chậm 3 giờ 7 phút. Thẻ <b>ngoài giờ</b> chỉ để biết khách nhắn ngoài giờ.</li>
      <li><b>Đúng giờ</b>: mọi lượt trong hội thoại được trả lời trong 1 giờ làm việc. <b>Phản hồi chậm</b>: có lượt chờ quá 1 giờ làm việc.</li>
      <li>Ảnh page tự gửi khi khách bấm quảng cáo không tính là Sale trả lời. Chỉ đo lượt khách nhắn từ 01/10/2026.</li>

    <h3>7. Chấm quy trình (từ 06/10/2026 14h53)</h3>

      <li><b>Báo giá không khai thác tiếp</b> — báo giá xong dừng, không hỏi thêm nhu cầu (nguyên tắc: vừa trả lời vừa khai thác).</li>
      <li><b>Page Sỉ gặp khách lẻ</b> — báo khoảng giá rồi chuyển đơn vị hỗ trợ khách lẻ bằng câu chuẩn SOP; từ chối thẳng "không bán lẻ, chỉ bán sỉ", tư vấn sâu, lộ nội bộ đều sai.</li>
      <li><b>Gửi dồn quá nhiều mẫu</b> (hơn 5 ảnh một lúc khi chưa rõ nhu cầu) · <b>Không chốt bước tiếp theo</b> khi khách hẹn cân nhắc · <b>Giảm giá ngay / nói xấu đối thủ</b>.</li>
      <li>Page <b>Nến Bơ - Tự Tại Viên</b> chưa chấm quy trình (chờ kịch bản riêng).</li>
    </ul>
    <h3>8. Sale & loại trừ đặc biệt</h3>
    <ul>
      <li>Từ 01/10/2026 mọi tin của <b>Hiền Thủy</b> (Facebook, TikTok, Zalo), <b>Nến Bơ - Tự Tại Viên</b> và page <b>Thời Đại</b> (Shidai) tính cho Sale <b>Vân Ngọc</b>.</li>
      <li>Nhân viên nội bộ đóng vai khách: Đức Tuấn, Đinh Ngọc Diệp (Chánh Tâm, 0973763458); tài khoản mang tên chính các kho / thương hiệu nhắn nhau.</li>
      <li>Tài khoản dùng chung "PANCAKE THT HOLDING", "Sales Admin" không dùng làm tên Sale, nhưng tin viết tay từ các tài khoản này vẫn tính là người thật trả lời.</li>
    </ul>
    <h3>9. Báo sai</h3>
    <p>Bấm "Báo sai" ở từng dòng → Claude soát bằng dữ liệu thật, sửa kết quả, báo sai đúng thì thêm vào luật chấm để không lặp lại, ghi cách xử lý vào <b>Lịch sử báo sai</b>.</p>
  </div>`;
}
async function resolveReport(id){
  try{await rpc('qc_xu_ly_bao_sai',{p_id:id,p_nguoi:ls.get(LS_TEN)||null});S.reports=await rpc('qc_ds_bao_sai')||[];render();}
  catch(e){toast(e.message);}
}
async function changeCode(){
  const moi=prompt('Mã truy cập mới (từ 8 ký tự):');if(!moi)return;
  try{await rpc('qc_doi_ma',{p_ma_moi:moi});S.ma=moi;ls.set(LS_MA,moi);toast('Đã đổi mã — báo lại mã mới cho người cùng xem');}
  catch(e){toast(e.message);}
}

// ── Khởi động ────────────────────────────────────────────────────────────
(async()=>{
  // mặc định THÁNG NÀY (anh Hải 5/10; trước là 7 ngày). Tải theo khoảng nên vẫn nhẹ (~6 KB/ngày đã nén, quota egress chung app MKT/Sale)
  {const r=quickRange('thismonth');S.from=r.from;S.to=r.to;}
  if(!S.ma){renderGate();return;}
  document.getElementById('app').innerHTML='<div class="muted" style="padding:60px;text-align:center">Đang tải…</div>';
  try{await load();await taiNhatKy();render();}catch(e){if(e.status===403){ls.del(LS_MA);S.ma='';}renderGate(e.status===403?'Mã đã đổi, nhập lại':e.message);}
})();
</script>
